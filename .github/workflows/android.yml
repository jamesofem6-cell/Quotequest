
name: Build QuoteQuest Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build QuoteQuest
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Configure QuoteQuest AdMob app ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          app_id = 'ca-app-pub-3760840152356990~7379739987'
          metadata = f'    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{app_id}" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              content = content.replace("</application>", metadata + "\\n    </application>")
          manifest.write_text(content)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: QuoteQuest-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
